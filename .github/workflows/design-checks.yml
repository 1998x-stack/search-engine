name: phase4-query-checks
on:
  push:
    branches: ["main", "docs/**", "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  phase4-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Static contracts and JSON/SQLite validation
        run: python scripts/validate_design.py
      - name: Run offline regression suite
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Offline graded nDCG and Recall fixture (synthetic, not quality benchmark)
        run: PYTHONPATH=src python scripts/evaluate_relevance.py --input tests/fixtures/relevance-demo.json
      - name: Check Compose configuration
        run: docker compose config --quiet
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --progress=plain -t search-engine-phase3:ci .
      - name: Initialize SQLite in container
        run: docker run --rm search-engine-phase3:ci python -m search_engine.cli --database /tmp/check.db init
  opensearch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install P0 runtime
        run: python -m pip install -e .
      - name: Configure OpenSearch host memory map
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start isolated OpenSearch development container
        run: docker compose up -d opensearch
      - name: Wait for local OpenSearch readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color opensearch
          exit 1
      - name: Live multilingual query DSL, BM25, tombstone and alias rebuild smoke
        env:
          OPENSEARCH_URL: http://127.0.0.1:9200
        run: python scripts/opensearch_live_smoke.py
      - name: Collect OpenSearch logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 opensearch
      - name: Stop isolated OpenSearch cluster
        if: always()
        run: docker compose down -v
