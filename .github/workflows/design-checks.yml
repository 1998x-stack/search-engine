name: phase1-checks
on:
  push:
    branches: ["main", "docs/**", "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  phase1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Static contracts
        run: python scripts/validate_design.py
      - name: Offline crawler integration and SQLite tests
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compose config syntax
        run: docker compose config --quiet
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Phase 1 API/worker image
        run: docker build --progress=plain -t search-engine-phase1:ci .
      - name: Smoke-test containerized crawl CLI and SQLite schema
        run: docker run --rm search-engine-phase1:ci python -m search_engine.cli --database /tmp/smoke.db init
