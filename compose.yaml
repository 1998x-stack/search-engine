# LOCAL DEVELOPMENT ONLY: OpenSearch security intentionally disabled; never expose publicly.
name: search-engine-dev

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SEARCH_DATABASE_PATH: /data/search.db
      OPENSEARCH_URL: http://opensearch:9200
      SEARCH_PHASE: design-scaffold
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - search-data:/data
    depends_on:
      opensearch:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  opensearch-data:
  search-data:
