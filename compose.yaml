# Development profile only. Security disabled on OpenSearch; never expose publicly.
name: search-engine-dev
services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
  api:
    build: .
    environment:
      SEARCH_DATABASE_PATH: /data/search.db
      SEARCH_SCHEMA_PATH: /app/schema/sqlite.sql
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - search-data:/data
    depends_on:
      opensearch:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
  crawler:
    profiles: ["crawl"]
    build: .
    command: ["python", "-m", "search_engine.cli", "worker", "--max-steps", "10000000"]
    environment:
      SEARCH_DATABASE_PATH: /data/search.db
      SEARCH_SCHEMA_PATH: /app/schema/sqlite.sql
      SEARCH_RAW_DIR: /data/raw
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-}
    volumes:
      - search-data:/data
    init: true
    stop_grace_period: 30s
    restart: "no"
  processor:
    profiles: ["crawl"]
    build: .
    command: ["python", "-m", "search_engine.cli", "process", "--max-steps", "10000000"]
    environment:
      SEARCH_DATABASE_PATH: /data/search.db
      SEARCH_SCHEMA_PATH: /app/schema/sqlite.sql
      SEARCH_RAW_DIR: /data/raw
    volumes:
      - search-data:/data
    init: true
    stop_grace_period: 30s
    restart: "no"
volumes:
  opensearch-data:
  search-data:
