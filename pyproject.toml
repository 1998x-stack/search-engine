[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-search-engine"
version = "0.0.1"
description = "Documentation-first search engine; API scaffold only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]

[tool.setuptools.packages.find]
where = ["src"]
